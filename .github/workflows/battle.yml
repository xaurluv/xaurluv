name: xbattle

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  attack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Process attack
        run: node scripts/process-attack.js

      - name: Commit updated battle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json generated/battle.svg
          git diff --cached --quiet || git commit -m "Update battle state"
          git push
